# Microsoft Corporation
#
# Raw stages template for the sources-upload PR check pipeline.
#
# This template is OneBranch-agnostic: it declares the stages/jobs/steps that
# do the actual work and exposes the OneBranch-coupled knobs as parameters.
# The wrapper at .github/workflows/ado/sources-upload.yml is responsible for
# choosing the OneBranch governed template variant (Official vs NonOfficial),
# configuring its featureFlags, and supplying concrete values for the
# parameters declared below.

parameters:
  - name: outputDirectory
    type: string
  - name: artifactBaseName
    type: string
  - name: containerImage
    type: string
  - name: poolType
    type: string
    default: linux
  - name: serviceConnection
    type: string
  - name: variableGroup
    type: string
  - name: timeoutInMinutes
    type: number

stages:
  - stage: PRCheck
    jobs:
      - job: CallControlTowerAPI
        # Non-blocking PR check: failing steps still render red error annotations
        # and surface in the build-issues view, but the job resolves to
        # SucceededWithIssues and the run to PartiallySucceeded, which the Azure
        # Pipelines GitHub integration reports as success to GitHub PR checks and
        # the merge queue. Errors and warnings remain visible to the user.
        # TODO: Remove `continueOnError` once the pipeline is stable so failures
        #       block PRs and the merge queue.
        # ADO task: 19179
        continueOnError: true
        # Must exceed the script's --poll-timeout-seconds (default 7200s = 120m)
        # with enough headroom for setup steps and the final API call.
        timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
        pool:
          type: ${{ parameters.poolType }}
        variables:
          - group: ${{ parameters.variableGroup }}
          - name: ob_outputDirectory
            value: ${{ parameters.outputDirectory }}
          - name: ob_artifactBaseName
            value: ${{ parameters.artifactBaseName }}
          - name: LinuxContainerImage
            value: ${{ parameters.containerImage }}
        steps:
          - script: |
              set -euo pipefail

              # For both triggers, Build.SourceVersion is the relevant source commit:
              # - PR trigger: ADO sets it to the GitHub-created merge commit (refs/pull/{n}/merge).
              # - CI/merge-queue trigger: it is the commit that landed on the base branch.
              source_hash="$SOURCE_COMMIT"

              if [[ "$BUILD_REASON" == "PullRequest" ]]; then
                # PR trigger: ADO provides the target branch directly.
                target_hash=$(git ls-remote "$UPSTREAM_REPO_URL" "$PR_TARGET_BRANCH" | cut -f1)
              else
                # CI/merge-queue trigger: extract the base branch from the merge-queue branch name.
                # Branch format: refs/heads/gh-readonly-queue/{base_branch}/pr-{pr_number}-{head_sha}
                if ! base_branch=$(grep -oP '(?<=^refs/heads/gh-readonly-queue/).+(?=/pr-[^/]+$)' <<< "$SOURCE_BRANCH"); then
                  echo "##[error]Unsupported SOURCE_BRANCH '$SOURCE_BRANCH' for non-PullRequest build. Expected 'refs/heads/gh-readonly-queue/<base>/pr-<n>-<sha>'."
                  exit 1
                fi
                target_hash=$(git ls-remote "$UPSTREAM_REPO_URL" "refs/heads/$base_branch" | cut -f1)
              fi

              echo "Source commit: $source_hash"
              echo "Target commit: $target_hash"

              echo "##vso[task.setvariable variable=sourceCommit]$source_hash"
              echo "##vso[task.setvariable variable=targetCommit]$target_hash"
            env:
              BUILD_REASON: $(Build.Reason)
              PR_TARGET_BRANCH: $(System.PullRequest.TargetBranch)
              SOURCE_BRANCH: $(Build.SourceBranch)
              SOURCE_COMMIT: $(Build.SourceVersion)
              UPSTREAM_REPO_URL: $(Build.Repository.Uri)
            displayName: "Determine source and target commit hashes"

          - task: PipAuthenticate@1
            displayName: "Authenticate pip"
            inputs:
              artifactFeeds: "azl/ControlTowerFeed"

          - script: |
              set -euo pipefail

              echo "##[group]Mock"
              tdnf install -y mock mock-rpmautospec python3-chardet
              sudo usermod -aG mock "$(whoami)"
              echo "##[endgroup]"

              echo "##[group]Azldev"
              echo "Installing azldev@${AZLDEV_COMMIT}..."
              go install "github.com/microsoft/azure-linux-dev-tools/cmd/azldev@${AZLDEV_COMMIT}"

              go_bin_path="$(go env GOPATH)/bin"
              echo "##vso[task.prependpath]$go_bin_path"

              "$go_bin_path/azldev" --version
              echo "##[endgroup]"

              echo "##[group]Python dependencies"
              pip install -r .github/workflows/scripts/control-tower/requirements.txt
              echo "##[endgroup]"
            displayName: "Install dependencies"
            env:
              AZLDEV_COMMIT: $(AzldevCommit)

          - script: |
              set -euo pipefail

              # Workaround for an ADO git config error.
              # The config key may not be present on every agent image, so tolerate its absence.
              git config --unset extensions.worktreeConfig || true

              # Full history is needed for lock resolution and spec rendering.
              if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                echo "##[group]Fetching full git history"
                git fetch --unshallow
                echo "##[endgroup]"
              fi

              echo "##[group]Updating lock files"
              azldev component update -a -q -O json > /tmp/lock-update.json
              echo "##[endgroup]"

              # Check if any locks drifted — azldev tells us directly.
              # If locks are not valid, we can't guarantee that any further steps are valid, so fail the PR check immediately.
              # Output is null when nothing changed, or a JSON array of objects.
              drifted=$(jq '[.[] | select(.changed == true)] | length // 0' /tmp/lock-update.json 2>/dev/null || echo 0)
              if [[ "$drifted" -gt 0 ]]; then
                echo "##[error]$drifted lock file(s) are not up to date. Run 'azldev component update -a' and commit the result."
                echo "##[group]Drifted components"
                jq -r '.[] | select(.changed == true) | .component' /tmp/lock-update.json
                echo "##[endgroup]"
                exit 1
              fi
            displayName: "Verify lock files are up to date"
            env:
              # OneBranch containers run as root. azldev refuses to run as root
              # by default, disable the root security check for this step.
              AZLDEV_ALLOW_ROOT: "1"

          - script: |
              set -euo pipefail

              artifact_dir="$ARTIFACT_STAGING_DIR/changed-components"
              json_file="$artifact_dir/changed-components.json"
              mkdir -p "$artifact_dir"

              # 'azldev component changed' compares the source and target commits and emits one
              # entry per component with its 'changeType' ('added', 'changed', 'unchanged', or
              # 'deleted') plus a 'sourcesChange' flag indicating whether the rendered 'sources'
              # file differs between commits. Only components with sourcesChange == true AND
              # changeType != 'deleted' are forwarded to Control Tower for upload.

              echo "##[group]Computing changed components"
              azldev component changed --from "$TARGET_COMMIT" --to "$SOURCE_COMMIT" -a  -O json > "$json_file"
              echo "##[endgroup]"

              echo "##[group]Changed components"
              cat "$json_file"
              echo "##[endgroup]"

              echo "##[group]Upload set (sourcesChange == true, not deleted)"
              upload_count=$(jq -r '[.[] | select(.sourcesChange == true and .changeType != "deleted")] | length' "$json_file")
              jq -r '.[] | select(.sourcesChange == true and .changeType != "deleted") | .component' "$json_file" | sort
              echo "Total: $upload_count component(s) to upload."
              echo "##[endgroup]"

              # Also write into ob_outputDirectory so OneBranch auto-publishes it
              # as a build artifact (explicit PublishPipelineArtifact is forbidden).
              ob_dir="$OB_OUTPUT_DIR/changed-components"
              mkdir -p "$ob_dir"
              cp "$json_file" "$ob_dir/"

              echo "##vso[task.setvariable variable=changedComponentsFile]$json_file"
            env:
              ARTIFACT_STAGING_DIR: $(Build.ArtifactStagingDirectory)
              # OneBranch containers run as root. azldev refuses to run as root
              # by default, disable the root security check for this step.
              AZLDEV_ALLOW_ROOT: "1"
              OB_OUTPUT_DIR: $(ob_outputDirectory)
              SOURCE_COMMIT: $(sourceCommit)
              TARGET_COMMIT: $(targetCommit)
            displayName: "Compute changed components"

          - script: |
              set -euo pipefail

              specs_dir="$(azldev config dump -q -f json | jq -r '.project.renderedSpecsDir')"

              # Re-render any component where either:
              #   - changeType is not 'unchanged' (added, changed — inputs differ)
              #   - sourcesChange is true (rendered sources file differs, even if
              #     the fingerprint didn't catch it — shouldn't happen, but safety net)
              # Always excludes 'deleted' — nothing to render for removed components.
              changed=$(jq -r '
                .[] |
                select(
                  .changeType != "deleted" and
                  (.changeType != "unchanged" or .sourcesChange == true)
                ) |
                .component
              ' "$CHANGED_COMPONENTS_FILE")

              if [[ -z "$changed" ]]; then
                echo "No changed components — skipping render."
              else
                changed_count=$(echo "$changed" | wc -l)
                echo "Rendering $changed_count changed component(s)..."
                echo "##[group]Specs rendering"
                # shellcheck disable=SC2086 — intentional word-splitting on component names
                azldev component render -q $changed
                echo "##[endgroup]"
              fi

              # Check for any new or modified files under the specs directory.
              if ! python3 .github/workflows/scripts/render-specs-check/check_rendered_specs.py --specs-dir "$specs_dir"; then
                echo "##[group]Git diff"
                git --no-pager diff -- "$specs_dir"
                echo "##[endgroup]"
                echo "##[error]Specs are not up to date. Run 'azldev component render -q -a --clean-stale' and try again."
                exit 1
              fi
            env:
              # OneBranch containers run as root. azldev refuses to run as root
              # by default, disable the root security check for this step.
              AZLDEV_ALLOW_ROOT: "1"
              CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
            displayName: "Verify rendered specs are up to date"

          - task: AzureCLI@2
            displayName: "Call Control Tower 'prcheck' API"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                python3 .github/workflows/scripts/control-tower/run_prcheck.py \
                  --api-audience "$API_AUDIENCE" \
                  --api-base-url "$API_BASE_URL" \
                  --build-reason "$BUILD_REASON" \
                  --changed-components-file "$CHANGED_COMPONENTS_FILE" \
                  --source-commit "$SOURCE_COMMIT" \
                  --repo-uri "$UPSTREAM_REPO_URL"
            env:
              API_AUDIENCE: $(ApiAudience)
              API_BASE_URL: $(ApiBaseUrl)
              BUILD_REASON: $(Build.Reason)
              CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
              SOURCE_COMMIT: $(sourceCommit)
              # TODO: Target commit is not used. Will be needed once we move detection of affected components to CT.
              # ADO task: 18816
              TARGET_COMMIT: $(targetCommit)
              UPSTREAM_REPO_URL: $(Build.Repository.Uri)
