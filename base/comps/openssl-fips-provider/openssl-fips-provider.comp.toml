# openssl-fips-provider: Ships only fips.so, built as close to vanilla OpenSSL as
# possible.  Based on the Fedora 43 openssl spec (same source + infrastructure
# patches), with all RHEL FIPS behavioural modifications removed so the binary
# is as close as possible to the upstream-validated module.
#
# Design doc: tobiasb-sandbox/azl4-openssl/openssl-fips-design.md
# Upstream commit: https://src.fedoraproject.org/rpms/openssl/commit/0990e54a2f6b6b8e4f3e238175382505fff8be51

[components.openssl-fips-provider]
spec = { type = "upstream", upstream-name = "openssl", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "0990e54a2f6b6b8e4f3e238175382505fff8be51" }

