# ---------------------------------------------------------------------------
# %prep: fix the source directory name.
# %autosetup uses %{name}-%{version} as the extract dir, but the tarball
# extracts to openssl-3.5.4/, not openssl-fips-provider-3.5.4/.
# ---------------------------------------------------------------------------

[[components.openssl-fips-provider.overlays]]
description = "Fix %autosetup -n to use the tarball's actual directory name (openssl-VERSION)"
type = "spec-search-replace"
regex = "%autosetup -S git -n %\\{name\\}-%\\{version\\}"
replacement = "%autosetup -S git -n openssl-%{version}"

# ---------------------------------------------------------------------------

[[components.openssl-fips-provider.overlays]]
# Patch 0058 (removed) added the build_inst_sw Makefile target. Replace with
# standard 'all' target.
description = "Replace build_inst_sw (added by removed patch 0058) with standard 'all' target"
type = "spec-search-replace"
regex = "make -s %\\{\\?_smp_mflags\\} build_inst_sw"
replacement = "make -s %{?_smp_mflags} all"

# ---------------------------------------------------------------------------

[[components.openssl-fips-provider.overlays]]
# Without patch 0017, fipsprov.c uses the standard FIPS_VENDOR macro (set by
# Configure from the version config, defaulting to "OpenSSL FIPS Provider").
# Override with our AZL vendor string via -DFIPS_VENDOR.
# The -DREDHAT_FIPS_VERSION flag is also removed; OPENSSL_VERSION_STR is used.
description = "Replace -DREDHAT_FIPS_VENDOR/-DREDHAT_FIPS_VERSION with AZL -DFIPS_VENDOR in Configure"
type = "spec-search-replace"
regex = "\\t-DREDHAT_FIPS_VENDOR.*\\\\"
replacement = "\t-DFIPS_VENDOR='\"\\\"Microsoft Azure Linux OpenSSL FIPS Provider\\\"\"' \\"

# ---------------------------------------------------------------------------
# %install: strip down to only fips.so; fipsmodule.cnf is generated later
# by fipsinstall in __spec_install_post (after strip/debuginfo extraction).
# ---------------------------------------------------------------------------

[[components.openssl-fips-provider.overlays]]
description = "After full install, keep only fips.so — everything else is discarded"
type = "spec-append-lines"
section = "%install"
lines = [
    "# Keep only fips.so; fipsmodule.cnf is generated by fipsinstall in __spec_install_post.",
    "cp -p $RPM_BUILD_ROOT%{_libdir}/ossl-modules/fips.so /tmp/fips.so.$$",
    "rm -rf $RPM_BUILD_ROOT",
    "install -d $RPM_BUILD_ROOT%{_libdir}/ossl-modules",
    "install -d $RPM_BUILD_ROOT%{_sysconfdir}/pki/tls",
    "mv /tmp/fips.so.$$ $RPM_BUILD_ROOT%{_libdir}/ossl-modules/fips.so",
]

# ---------------------------------------------------------------------------
# __spec_install_post: run fipsinstall AFTER strip/debuginfo extraction so the
# HMAC is computed against the final, stripped fips.so.
#
# The original definition lived between %check and %install in the upstream
# spec; removing %check takes it with it, so we inject it via prepend-lines.
# ---------------------------------------------------------------------------

[[components.openssl-fips-provider.overlays]]
description = "Inject __spec_install_post before %install to run fipsinstall post-strip"
type = "spec-prepend-lines"
section = "%install"
lines = [
    "# Run fipsinstall after strip/debuginfo so the HMAC covers the final binary.",
    "%define __spec_install_post \\",
    "    %{?__debug_package:%{__debug_install_post}} \\",
    "    %{__arch_install_post} \\",
    "    %{__os_install_post} \\",
    "    LD_LIBRARY_PATH=. OPENSSL_CONF=/dev/null ./apps/openssl fipsinstall -module $RPM_BUILD_ROOT%{_libdir}/ossl-modules/fips.so -out $RPM_BUILD_ROOT%{_sysconfdir}/pki/tls/fipsmodule.cnf \\",
    "%{nil}",
]

